services:
  ros2-sunshine:
    build: .
    image: ros2-jazzy-sunshine:latest
    container_name: ros2_sunshine_server

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - DISPLAY=${DISPLAY}
      - SUNSHINE_USERNAME=${SUNSHINE_USERNAME:-admin}
      - SUNSHINE_PASSWORD=${SUNSHINE_PASSWORD:-change_me}

    # Network
    ports:
      - "47984-47990:47984-47990/tcp"
      - "48010:48010"
      - "47998-48000:47998-48000/udp"

    # Volumes
    volumes:
      # Entire home directory for persistence (/root config, .vscode, .local, etc.)
      - ./root:/root

      # ROS2 workspace for persistence
      - ./ros2_ws:/home/ros/ros2_ws

      # X11 display socket for GUI apps (Gazebo, RViz)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro

    # Device access
    devices:
      - nvidia.com/gpu=all # Match docker run CDI GPU selection
      - /dev/dri:/dev/dri # GPU device
      - /dev/fuse:/dev/fuse # For mounting filesystems if needed
      - /dev/uinput:/dev/uinput # Required for Sunshine virtual inputs

    # Capabilities for Sunshine
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_NICE

    # Privileged mode (alternative to specific caps, less secure)
    # privileged: true

    # Allow display connection
    ipc: host

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ros2-network
